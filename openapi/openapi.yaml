openapi: 3.1.0
info:
  title: Sign in with ChatGPT
  version: 0.1.0
  summary: OAuth sign-in and ChatGPT plan inference, as used by this repository.
  description: |
    Unofficial description of the HTTP endpoints this repository calls to
    sign in with ChatGPT and run inference against the user's ChatGPT plan.
    It is derived from `chatgpt-auth`, `llm-chatgpt-plan`,
    `fastapi-chatgpt-plan`, and `scripts/`; OpenAI does not publish this
    contract and may change it at any time.

    Flow:

    1. `GET /.well-known/openid-configuration` and `GET /.well-known/jwks.json`
       (the actual URLs come from discovery metadata).
    2. Open `GET /oauth/authorize` in the user's browser with PKCE (`S256`).
       The first sign-in uses `client_id=dynamic_agent_client`; the issued
       client ID comes back in the redirect query (`client_id`).
    3. The browser is redirected to the client's `redirect_uri`
       (`AuthorizationCallback`).
    4. `POST /oauth/token` with `grant_type=authorization_code`, then verify
       the returned ID token (RS256, `iss`, `aud`/`azp` = client ID, `nonce`).
    5. Call `api.openai.com/v1` with the access token as a Bearer token.
       Refresh with `grant_type=refresh_token` shortly before `expires_in`.
    6. `POST /oauth/revoke` with the refresh token to sign out.

    Steps that OpenAPI cannot express (browser navigation, PKCE and nonce
    generation, ID token verification, refresh timing) are described in
    `openapi/README.md`.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://auth.openai.com
    description: OpenAI identity provider (OIDC issuer)
tags:
  - name: discovery
  - name: oauth
  - name: inference
security: []
paths:
  /.well-known/openid-configuration:
    get:
      tags: [discovery]
      operationId: getOpenIdConfiguration
      summary: OpenID Provider metadata
      description: |
        Clients must check that `issuer` is `https://auth.openai.com` and that
        `authorization_endpoint`, `token_endpoint`, `jwks_uri`, and (if present)
        `revocation_endpoint` are `https` URLs on `auth.openai.com`.
      responses:
        "200":
          description: Discovery metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenIdConfiguration"
  /.well-known/jwks.json:
    get:
      tags: [discovery]
      operationId: getJwks
      summary: Signing keys for ID tokens
      description: Use the `jwks_uri` from discovery; this path is the usual value.
      responses:
        "200":
          description: JSON Web Key Set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonWebKeySet"
  /oauth/authorize:
    get:
      tags: [oauth]
      operationId: authorize
      summary: Authorization endpoint (open in a browser)
      description: |
        Not called by an HTTP client: build this URL and open it in the user's
        browser. Use the `authorization_endpoint` from discovery; this path is
        the usual value. The result is delivered to `redirect_uri`
        (see `AuthorizationCallback` in `components.pathItems`).
      parameters:
        - name: client_id
          in: query
          required: true
          description: |
            `dynamic_agent_client` for a new registration, or a previously
            issued client ID to sign in again with the same registration.
          schema:
            type: string
            examples: [dynamic_agent_client]
        - name: ext_agent_host_id
          in: query
          required: true
          description: Stable per-installation identifier generated by the client.
          schema:
            type: string
            examples: ["urn:uuid:3f1c5d2e-8a4b-4c6d-9e0f-123456789abc"]
        - name: response_type
          in: query
          required: true
          schema:
            const: code
        - name: redirect_uri
          in: query
          required: true
          description: Loopback callback, e.g. `http://127.0.0.1:{port}/auth/callback`.
          schema:
            type: string
            format: uri
        - name: scope
          in: query
          required: true
          description: Space-separated scopes. All of the examples are requested.
          schema:
            type: string
            examples:
              - openid profile email offline_access resource.invoke chatgpt.tokens.use.direct
        - name: resource
          in: query
          required: true
          schema:
            const: https://api.openai.com/v1
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: nonce
          in: query
          required: true
          schema:
            type: string
        - name: code_challenge_method
          in: query
          required: true
          schema:
            const: S256
        - name: code_challenge
          in: query
          required: true
          description: Unpadded base64url SHA-256 of the code verifier.
          schema:
            type: string
        - name: agent_name_hint
          in: query
          description: Display name for a new registration (`dynamic_agent_client` only).
          schema:
            type: string
        - name: id_token_hint
          in: query
          description: Previous ID token when signing in again with an issued client ID.
          schema:
            type: string
        - name: login_hint
          in: query
          description: Previous email when signing in again with an issued client ID.
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the sign-in and consent UI, then to `redirect_uri`.
  /oauth/token:
    post:
      tags: [oauth]
      operationId: token
      summary: Token endpoint
      description: Use the `token_endpoint` from discovery; this path is the usual value.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - $ref: "#/components/schemas/AuthorizationCodeGrant"
                - $ref: "#/components/schemas/RefreshTokenGrant"
              discriminator:
                propertyName: grant_type
                mapping:
                  authorization_code: "#/components/schemas/AuthorizationCodeGrant"
                  refresh_token: "#/components/schemas/RefreshTokenGrant"
      responses:
        "200":
          description: Tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/OAuthError"
        "401":
          $ref: "#/components/responses/OAuthError"
  /oauth/revoke:
    post:
      tags: [oauth]
      operationId: revoke
      summary: Revoke a refresh token (sign out)
      description: |
        Use the `revocation_endpoint` from discovery when present; this path is
        the usual value. Only an empty `200` confirms revocation.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/RevocationRequest"
      responses:
        "200":
          description: Revoked
        "400":
          $ref: "#/components/responses/OAuthError"
  /models:
    servers:
      - url: https://api.openai.com/v1
    get:
      tags: [inference]
      operationId: listModels
      summary: Models available to the signed-in ChatGPT plan
      description: Only entries with `visibility` = `list` are meant to be shown.
      security:
        - chatgptOAuth: [chatgpt.tokens.use.direct]
      responses:
        "200":
          description: Models
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelList"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
  /responses:
    servers:
      - url: https://api.openai.com/v1
    post:
      tags: [inference]
      operationId: createResponse
      summary: Create a streamed response (OpenAI Responses API)
      description: |
        The subset of the Responses API used here. `store` must be `false` and
        `stream` `true`. Treat a stream that ends without `response.completed`
        as a failure.
      security:
        - chatgptOAuth: [chatgpt.tokens.use.direct]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateResponseRequest"
      responses:
        "200":
          description: Server-sent events; each `data:` line is a `ResponseStreamEvent`.
          content:
            text/event-stream:
              schema:
                type: string
              x-event-schema:
                $ref: "#/components/schemas/ResponseStreamEvent"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
components:
  securitySchemes:
    chatgptOAuth:
      type: oauth2
      description: |
        Authorization code flow with PKCE (`S256`). Every authorization request
        also needs `resource=https://api.openai.com/v1`, `nonce`, and
        `ext_agent_host_id`; see `/oauth/authorize`.
      flows:
        authorizationCode:
          authorizationUrl: https://auth.openai.com/oauth/authorize
          tokenUrl: https://auth.openai.com/oauth/token
          refreshUrl: https://auth.openai.com/oauth/token
          scopes:
            openid: OpenID Connect sign-in
            profile: Name in the ID token
            email: Email in the ID token
            offline_access: Refresh token
            resource.invoke: Call the requested resource
            chatgpt.tokens.use.direct: Use the user's ChatGPT plan for inference
    chatgptOpenIdConnect:
      type: openIdConnect
      openIdConnectUrl: https://auth.openai.com/.well-known/openid-configuration
  pathItems:
    AuthorizationCallback:
      description: |
        Served by the client at its `redirect_uri` (for example
        `http://127.0.0.1:{port}/auth/callback`). The browser delivers the
        authorization result here. Check `state` before anything else.
      get:
        operationId: authorizationCallback
        parameters:
          - name: state
            in: query
            required: true
            schema:
              type: string
          - name: code
            in: query
            description: Present on success.
            schema:
              type: string
          - name: client_id
            in: query
            description: |
              The issued client ID. Present after a `dynamic_agent_client`
              sign-in; must match the requested client ID otherwise.
            schema:
              type: string
          - name: error
            in: query
            description: Present when the user declined or the request failed.
            schema:
              type: string
          - name: error_description
            in: query
            schema:
              type: string
        responses:
          "200":
            description: Result received
          "400":
            description: Unexpected callback (wrong host, path, or state)
  schemas:
    OpenIdConfiguration:
      type: object
      required: [issuer, authorization_endpoint, token_endpoint, jwks_uri]
      properties:
        issuer:
          const: https://auth.openai.com
        authorization_endpoint:
          type: string
          format: uri
        token_endpoint:
          type: string
          format: uri
        jwks_uri:
          type: string
          format: uri
        revocation_endpoint:
          type: string
          format: uri
      additionalProperties: true
    JsonWebKeySet:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            required: [kty]
            properties:
              kty:
                type: string
              kid:
                type: string
              alg:
                type: string
              use:
                type: string
              n:
                type: string
              e:
                type: string
            additionalProperties: true
    AuthorizationCodeGrant:
      type: object
      required: [grant_type, client_id, code, code_verifier, redirect_uri, resource]
      properties:
        grant_type:
          const: authorization_code
        client_id:
          type: string
          description: The issued client ID (never `dynamic_agent_client`).
        code:
          type: string
        code_verifier:
          type: string
        redirect_uri:
          type: string
          format: uri
        resource:
          const: https://api.openai.com/v1
    RefreshTokenGrant:
      type: object
      required: [grant_type, client_id, refresh_token, resource]
      properties:
        grant_type:
          const: refresh_token
        client_id:
          type: string
        refresh_token:
          type: string
        resource:
          const: https://api.openai.com/v1
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          description: Compared case-insensitively with `Bearer`.
          examples: [Bearer]
        expires_in:
          type: number
          exclusiveMinimum: 0
          maximum: 86400
        refresh_token:
          type: string
          description: Always returned for `authorization_code`; may be rotated on refresh.
        id_token:
          type: string
          description: |
            RS256 JWT. Required for `authorization_code`. When present on refresh,
            its `sub` must match the stored account.
        scope:
          type: string
          description: |
            Granted scopes, space-separated. If omitted on refresh, keep the
            previous scopes. Inference requires `chatgpt.tokens.use.direct`.
      additionalProperties: true
    RevocationRequest:
      type: object
      required: [token, client_id]
      properties:
        token:
          type: string
        token_type_hint:
          const: refresh_token
        client_id:
          type: string
    OAuthErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: string
          examples: [invalid_grant]
        error_description:
          type: string
      additionalProperties: true
    ApiErrorBody:
      type: object
      required: [error]
      properties:
        error:
          oneOf:
            - type: string
            - type: object
              properties:
                code:
                  type: [string, "null"]
                  examples:
                    - subscription_sharing_usage_limit_exceeded
                    - subscription_sharing_usage_unavailable
                message:
                  type: [string, "null"]
                param:
                  type: [string, "null"]
                type:
                  type: [string, "null"]
              additionalProperties: true
      additionalProperties: true
    Model:
      type: object
      required: [slug]
      properties:
        slug:
          type: string
          description: Value for `model` in `/responses`.
        display_name:
          type: string
        visibility:
          type: string
          examples: [list, hide]
      additionalProperties: true
    ModelList:
      type: object
      required: [models]
      properties:
        models:
          type: array
          items:
            $ref: "#/components/schemas/Model"
      additionalProperties: true
    InputMessage:
      type: object
      required: [role, content]
      properties:
        role:
          enum: [user, assistant, system, developer]
        content:
          type: string
    CreateResponseRequest:
      type: object
      required: [model, input, store, stream]
      properties:
        model:
          type: string
          description: A `slug` from `/models`.
        input:
          type: array
          items:
            $ref: "#/components/schemas/InputMessage"
        instructions:
          type: string
        reasoning:
          type: object
          properties:
            effort:
              enum: [minimal, low, medium, high]
        store:
          const: false
        stream:
          const: true
      additionalProperties: true
    ResponseStreamEvent:
      type: object
      required: [type]
      description: |
        Only the events this repository handles are listed; other event types
        may appear and should be ignored.
      properties:
        type:
          type: string
          examples:
            - response.output_text.delta
            - response.completed
            - response.failed
            - response.incomplete
            - error
        delta:
          type: string
          description: Text chunk for `response.output_text.delta`.
        response:
          type: object
          properties:
            usage:
              type: object
              properties:
                input_tokens:
                  type: integer
                output_tokens:
                  type: integer
              additionalProperties: true
            error:
              type: [object, "null"]
              properties:
                code:
                  type: [string, "null"]
                message:
                  type: [string, "null"]
              additionalProperties: true
          additionalProperties: true
        code:
          type: [string, "null"]
          description: Error code on `error` events.
        message:
          type: [string, "null"]
      additionalProperties: true
  responses:
    OAuthError:
      description: OAuth error. Treat as "sign in again" for the token endpoint.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OAuthErrorBody"
    ApiError:
      description: |
        API error. `401` means the token is no longer valid; the usage codes
        in `error.code` mean the ChatGPT plan quota is unavailable or exhausted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorBody"
