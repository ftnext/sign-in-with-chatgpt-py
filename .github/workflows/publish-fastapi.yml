name: Publish FastAPI Python Package

on:
  release:
    types: [published]

defaults:
  run:
    working-directory: fastapi-chatgpt-plan

permissions:
  contents: read

jobs:
  test:
    if: startsWith(github.event.release.tag_name, 'fastapi-chatgpt-plan-')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: fastapi-chatgpt-plan/pyproject.toml
    - name: Verify release tag matches package version
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        python - <<'PY'
        import os
        import sys
        import tomllib
        from pathlib import Path

        version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
        expected = f"fastapi-chatgpt-plan-{version}"
        if os.environ["RELEASE_TAG"] != expected:
            sys.exit(f"Release tag must match package version: {expected}")
        PY
    - name: Install dependencies
      run: |
        pip install -e . --group dev
    - name: Run tests
      run: |
        python -m pytest
  deploy:
    runs-on: ubuntu-latest
    needs: [test]
    environment: release
    permissions:
      id-token: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.14"
        cache: pip
        cache-dependency-path: fastapi-chatgpt-plan/pyproject.toml
    - name: Install dependencies
      run: |
        pip install setuptools wheel build
    - name: Build
      run: |
        python -m build
    - name: Publish
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
      with:
        packages-dir: fastapi-chatgpt-plan/dist/
